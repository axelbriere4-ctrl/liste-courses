<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseSync</title>
    <script src="https://tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">

    <!-- Header Fictif / Choix Magasin -->
    <div class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <h1 class="text-xl font-bold text-center">🛒 CourseSync</h1>
        <div class="mt-2">
            <label class="text-xs block opacity-80">Ordre du magasin :</label>
            <select id="storeSelect" class="w-full bg-blue-700 text-white p-2 rounded mt-1 border border-blue-500 focus:outline-none" onchange="loadStoreOrder()">
                <option value="standard">Standard (Fruits -> Frais -> Épicerie -> Non-Alimentaire)</option>
                <option value="lidl">Configuration Lidl Type</option>
                <option value="leclerc">Configuration Leclerc Type</option>
            </select>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4">
        <!-- Formulaire d'ajout -->
        <form id="addForm" class="bg-white p-4 rounded-xl shadow mb-6 flex gap-2">
            <input type="text" id="itemName" placeholder="Ex: Pommes, Lait..." class="flex-1 border p-2 rounded focus:outline-blue-500" required>
            <select id="itemCategory" class="border p-2 rounded bg-gray-50 text-sm">
                <option value="Fruits & Légumes">🥦 Fruits & Lég</option>
                <option value="Frais & Boulangerie">🧀 Frais / Pain</option>
                <option value="Épicerie">🥫 Épicerie</option>
                <option value="Boissons">🍾 Boissons</option>
                <option value="Hygiène & Maison">🧼 Maison</option>
            </select>
            <button type="submit" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded font-bold">+</button>
        </form>

        <!-- Liste des courses triée -->
        <div id="shoppingList" class="space-y-4">
            <!-- Les sections de rayons injectées par JS battront ici -->
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION FIREBASE ---
        // Remplir avec tes identifiants Firebase Console (Projet Gratuit)
        const firebaseConfig = {
            apiKey: "TON_API_KEY",
            authDomain: "TON_://firebaseapp.com",
            projectId: "TON_PROJECT_ID",
            storageBucket: "TON_://appspot.com",
            messagingSenderId: "TON_SENDER_ID",
            appId: "TON_APP_ID"
        };
        
        // Initialisation de secours si les clés ne sont pas encore mises
        if(firebaseConfig.apiKey !== "TON_API_KEY") {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore ? firebase.firestore() : null;

        // --- 2. BASE DE DONNÉES LOCALE DE SECOURS (Si pas de Firebase ce soir) ---
        let localItems = JSON.parse(localStorage.getItem('courses')) || [];

        // Dictionnaires d'ordre des rayons selon le magasin
        const storeOrders = {
            standard: ["Fruits & Légumes", "Frais & Boulangerie", "Épicerie", "Boissons", "Hygiène & Maison"],
            lidl: ["Fruits & Légumes", "Frais & Boulangerie", "Épicerie", "Hygiène & Maison", "Boissons"],
            leclerc: ["Hygiène & Maison", "Boissons", "Épicerie", "Fruits & Légumes", "Frais & Boulangerie"]
        };

        let currentOrder = storeOrders.standard;

        function loadStoreOrder() {
            const store = document.getElementById('storeSelect').value;
            currentOrder = storeOrders[store] || storeOrders.standard;
            renderList();
        }

        // --- 3. GESTION DES DONNÉES ---
        const form = document.getElementById('addForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('itemName').value;
            const category = document.getElementById('itemCategory').value;

            const newItem = { name, category, checked: false, createdAt: Date.now() };

            if (db) {
                await db.collection("items").add(newItem);
            } else {
                localItems.push({ ...newItem, id: Date.now().toString() });
                localStorage.setItem('courses', JSON.stringify(localItems));
                renderList();
            }
            form.reset();
        });

        async function toggleCheck(id, currentStatus) {
            if (db) {
                await db.collection("items").doc(id).update({ checked: !currentStatus });
            } else {
                localItems = localItems.map(item => item.id === id ? { ...item, checked: !currentStatus } : item);
                localStorage.setItem('courses', JSON.stringify(localItems));
                renderList();
            }
        }

        async function deleteChecked() {
            if(confirm("Supprimer les éléments cochés ?")) {
                if (db) {
                    const snapshot = await db.collection("items").where("checked", "==", true).get();
                    snapshot.forEach(doc => doc.ref.delete());
                } else {
                    localItems = localItems.filter(item => !item.checked);
                    localStorage.setItem('courses', JSON.stringify(localItems));
                    renderList();
                }
            }
        }

        // --- 4. AFFICHAGE SYNCHRONISÉ ET TRIÉ ---
        function renderList(itemsArray = localItems) {
            const container = document.getElementById('shoppingList');
            container.innerHTML = "";

            if(itemsArray.length === 0) {
                container.innerHTML = "<p class='text-center text-gray-500 py-8'>La liste est vide 🍉</p>";
                return;
            }

            // Tri selon l'ordre du magasin choisi
            const grouped = {};
            currentOrder.forEach(ray => grouped[ray] = []);
            
            itemsArray.forEach(item => {
                if (!grouped[item.category]) grouped[item.category] = [];
                grouped[item.category].push(item);
            });

            currentOrder.forEach(category => {
                if (grouped[category] && grouped[category].length > 0) {
                    const section = document.createElement('div');
                    section.className = "bg-white p-3 rounded-lg shadow-sm border-l-4 border-blue-500 mb-3";
                    
                    let html = `<h3 class="font-bold text-sm text-blue-600 uppercase mb-2">${category}</h3><ul class="divide-y">`;
                    
                    grouped[category].forEach(item => {
                        html += `
                            <li class="py-2 flex items-center justify-between cursor-pointer" onclick="toggleCheck('${item.id}', ${item.checked})">
                                <span class="${item.checked ? 'line-through text-gray-400' : 'text-gray-800'} font-medium">${item.name}</span>
                                <input type="checkbox" ${item.checked ? 'checked' : ''} class="w-5 h-5 rounded text-blue-600 focus:ring-blue-500">
                            </li>
                        `;
                    });
                    
                    html += `</ul>`;
                    section.innerHTML = html;
                    container.appendChild(section);
                }
            });

            // Bouton de nettoyage global si articles cochés
            if(itemsArray.some(i => i.checked)) {
                const btn = document.createElement('button');
                btn.className = "w-full bg-red-100 hover:bg-red-200 text-red-600 p-2.5 rounded-lg font-semibold text-sm transition mt-4";
                btn.innerText = "🗑️ Nettoyer les articles achetés";
                btn.onclick = deleteChecked;
                container.appendChild(btn);
            }
        }

        // Écoute en temps réel Firebase (si configuré)
        if (db) {
            db.collection("items").orderBy("createdAt", "desc").onSnapshot(snapshot => {
                const items = [];
                snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                renderList(items);
            });
        } else {
            renderList(); // Mode LocalStorage par défaut
        }
    </script>
</body>
</html>
